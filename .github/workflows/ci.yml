name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DJANGO_SETTINGS_MODULE: config.settings
  DJANGO_SECRET_KEY: ci-only-not-a-real-secret
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.16.3
      - run: ruff check --output-format=github .
      - run: ruff format --check --diff .

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Django system checks
        run: python manage.py check
      - name: Missing migrations
        # Fails if a model change was committed without its migration, which is
        # otherwise only discovered on deploy.
        run: python manage.py makemigrations --check --dry-run

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Django 6.1 requires Python >= 3.12, so 3.11 isn't a supported target.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests
        run: python manage.py test --shuffle --verbosity 2
      - name: Tests (pytest runner)
        run: pytest

  smoke:
    # End-to-end cover on top of the unit suite: this boots the real WSGI stack,
    # so it catches broken settings and routing that unit tests pass right over. It boots the real WSGI stack and
    # asserts ranking, fallback, validation and the frontend still behave.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrate and seed
        run: |
          python manage.py migrate --no-input
          python manage.py seed_deals
      - name: Exercise the service through WSGI
        run: python smoke.py

  deploy-check:
    # Not a deploy: proves the Vercel entry point imports and serves a request
    # under the environment variables Vercel sets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Cold start through the serverless entry point
        env:
          VERCEL: "1"
          VERCEL_URL: ci.vercel.app
        run: python smoke.py --cold-start
